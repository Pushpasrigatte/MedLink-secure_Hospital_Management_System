<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e6ffee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .success-container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .user-id-box {
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 25px;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #388e3c;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        a:hover {
            background-color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h2>🎉 Registration Successful!</h2>
        <div class="user-id-box">Your ID: {{ user_id }}</div><br>
        <div class="btn-group">
            <a href="/">Go to Home</a>
            <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
