<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      background-image: linear-gradient(to bottom, #f0b7a4bf, #f1d1b5, #568ea6);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .hos {
      height: 3rem;
      background-color: cornflowerblue;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      color: white;
    }
    .login-box {
      padding: 30px;
      border-radius: 10px;
      background-color: white;
      width: 300px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      margin: 6rem auto;
    }
    .login-box h2 {
      text-align: center;
    }
    .login-box input,
    .login-box select {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-box input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    .login-box input[type="submit"]:hover {
      background-color: #45a049;
    }
    .forgot {
      text-align: right;
      margin-bottom: 10px;
    }
    .forgot a {
      color: #007BFF;
      text-decoration: none;
    }
    .forgot a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="hos">
    <h1>Hospital Management</h1>
  </div>

  <div class="login-box">
    <h2>Login Page</h2>
    <form action="/login" method="POST">
      <label for="role">User Type</label>
      <select id="role" name="role" required>
        <option value="">Select</option>
        <option value="hospital">Hospital Office</option>
        <option value="doctor">Doctor</option>
        <option value="patient">Patient</option>
        <option value="lab">Lab</option>
        <option value="admin">Admin</option>
      </select>

      <label for="username">User Name</label>
      <input type="text" name="username" id="username" required placeholder="Enter username" />

      <label for="password">Password</label>
      <input type="password" name="password" id="password" required minlength="6" placeholder="Enter password" />

      <div class="forgot">
  <a href="{{ url_for('forgot') }}">Forgot Password?</a>
</div>

     

      <input type="submit" value="Login" />
    </form>
  </div>
</body>
</html>
